{% extends "base.html" %}

{% block title %}خطأ - OncoVision{% endblock %}

{% block content %}
<section class="error-page">
    <div class="container">
        <div class="error-content">
            <div class="error-icon">
                <i class="fas fa-exclamation-triangle"></i>
            </div>
            <h1>{{ error_code }}</h1>
            <h2>{{ error_message }}</h2>
            <p>{{ error_description }}</p>
            <div class="error-actions">
                <a href="{{ url_for('dashboard') }}" class="btn btn-primary">العودة للوحة التحكم</a>
                <a href="{{ url_for('index') }}" class="btn btn-secondary">الصفحة الرئيسية</a>
            </div>
        </div>
    </div>
</section>
{% endblock %}

{% block extra_styles %}
<style>
.error-page {
    min-height: 60vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 0;
}

.error-content {
    text-align: center;
    max-width: 500px;
}

.error-icon {
    font-size: 4rem;
    color: #e91e63;
    margin-bottom: 1rem;
}

.error-content h1 {
    font-size: 3rem;
    color: #333;
    margin-bottom: 0.5rem;
}

.error-content h2 {
    color: #666;
    margin-bottom: 1rem;
    font-weight: normal;
}

.error-content p {
    color: #888;
    margin-bottom: 2rem;
    line-height: 1.6;
}

.error-actions {
    display: flex;
    gap: 1rem;
    justify-content: center;
    flex-wrap: wrap;
}

.error-actions .btn {
    min-width: 150px;
}
</style>
{% endblock %}
